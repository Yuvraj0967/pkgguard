<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pkgguard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14171f; --muted: #667085; --line: #e4e7ec;
    --block: #c0362c; --block-bg: #fdecea; --warn: #b26a00; --warn-bg: #fff4e0; --ok: #1f7a4d; --ok-bg: #e6f5ec;
    --accent: #3b5bdb; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --ink: #e6e9ef; --muted: #8b94a3; --line: #272e38;
      --block: #ff7b72; --block-bg: #3a1a1a; --warn: #f0b24b; --warn-bg: #3a2c10; --ok: #56d364; --ok-bg: #12301d; --accent: #7c9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tile .n { font-size: 28px; font-weight: 650; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .tile.b .n { color: var(--block); } .tile.w .n { color: var(--warn); } .tile.o .n { color: var(--ok); }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ev { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .4px; }
  .badge.block { color: var(--block); background: var(--block-bg); } .badge.warn { color: var(--warn); background: var(--warn-bg); } .badge.allow { color: var(--ok); background: var(--ok-bg); }
  .cmd { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 12px; }
  .finds { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .finds li { font-size: 13px; }
  .sev { font-weight: 650; } .sev.critical, .sev.high { color: var(--block); } .sev.medium { color: var(--warn); }
  .ev-line { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 12px; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .side-list { list-style: none; margin: 0; padding: 0; }
  .side-list li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .side-list li:last-child { border-bottom: 0; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  #gate { max-width: 420px; margin: 80px auto; padding: 20px; }
  #gate input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-family: var(--mono); }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>pkgguard</h1><span class="sub">what your agents try to install</span>
  <span class="live"><span class="dot" id="dot"></span><span id="livetxt">connecting</span></span>
</header>

<div id="gate" hidden>
  <p>Paste the dashboard token (printed when the gateway started).</p>
  <input id="tok" placeholder="token" autocomplete="off">
  <p><button id="go">Open dashboard</button></p>
</div>

<main id="app" hidden>
  <section class="tiles">
    <div class="tile"><div class="n" id="t-total">0</div><div class="l">commands inspected</div></div>
    <div class="tile b"><div class="n" id="t-block">0</div><div class="l">blocked</div></div>
    <div class="tile w"><div class="n" id="t-warn">0</div><div class="l">warned</div></div>
    <div class="tile o"><div class="n" id="t-allow">0</div><div class="l">allowed</div></div>
  </section>
  <div class="grid2">
    <section class="card"><h2>Live feed</h2><div id="feed"><div class="empty">No installs seen yet. Run an agent through the gateway.</div></div></section>
    <div style="display:grid;gap:16px;align-content:start">
      <section class="card"><h2>Top risk signals</h2><ul class="side-list" id="rules"></ul></section>
      <section class="card"><h2>Human approvals</h2><ul class="side-list" id="approvals"></ul></section>
    </div>
  </div>
</main>

<script>
(function () {
  var token = "";
  try { token = sessionStorage.getItem("pg_token") || ""; } catch (e) {}
  var m = location.hash.match(/token=([0-9a-f]+)/);
  if (m) { token = m[1]; try { sessionStorage.setItem("pg_token", token); } catch (e) {} history.replaceState(null, "", location.pathname); }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function api(path, opts) {
    opts = opts || {}; opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
    return fetch(path, opts).then(function (r) { if (r.status === 401) throw new Error("auth"); return r.json(); });
  }

  if (!token) { $("gate").hidden = false; $("go").onclick = function () { token = $("tok").value.trim(); try { sessionStorage.setItem("pg_token", token); } catch (e) {} location.reload(); }; return; }
  $("app").hidden = false;

  var seen = {};
  function render(ev) {
    var d = ev.decision, id = ev.id;
    if (seen[id]) return; seen[id] = true;
    var feed = $("feed"); if (feed.querySelector(".empty")) feed.innerHTML = "";
    // offer Approve only where approving can help: critical findings (known malware,
    // malicious install code, deny list) cannot be approved, so those packages get no button
    var pkgs = {}, hard = {};
    (d.findings || []).forEach(function (f) {
      if (!f.package) return;
      var name = f.package.split(/@(?=[^@/]*$)/)[0];
      if (f.severity === "critical") hard[name] = 1;
      else if (f.severity !== "info" && f.severity !== "low") pkgs[name] = 1;
    });
    Object.keys(hard).forEach(function (n) { delete pkgs[n]; });
    var finds = (d.findings || []).filter(function (f) { return f.severity === "medium" || f.severity === "high" || f.severity === "critical"; }).map(function (f) {
      var evs = (f.evidence || []).slice(0, 2).map(function (e) { return '<div class="ev-line">' + esc(e) + "</div>"; }).join("");
      return '<li><span class="sev ' + f.severity + '">' + f.severity + "</span> <b>" + esc(f.id) + "</b>" + (f.package ? " &middot; " + esc(f.package) : "") + " &mdash; " + esc(f.message) + evs + "</li>";
    }).join("");
    var btns = d.action === "allow" ? "" : Object.keys(pkgs).map(function (p) { return '<button data-pkg="' + esc(p) + '">Approve ' + esc(p) + " (24h)</button>"; }).join(" ");
    var row = document.createElement("div"); row.className = "ev";
    row.innerHTML = '<div class="top"><span class="badge ' + d.action + '">' + d.action + '</span><span class="cmd">' + esc(d.command) + '</span></div>' +
      '<div class="meta">' + new Date(ev.time).toLocaleTimeString() + " &middot; " + esc(ev.surface) + " &middot; tool: " + esc(ev.tool || "?") + "</div>" +
      (finds ? '<ul class="finds">' + finds + "</ul>" : "") + (btns ? '<div style="margin-top:8px">' + btns + "</div>" : "");
    feed.insertBefore(row, feed.firstChild);
    while (feed.children.length > 60) feed.removeChild(feed.lastChild);
  }
  $("feed").addEventListener("click", function (e) {
    var p = e.target.getAttribute && e.target.getAttribute("data-pkg"); if (!p) return;
    api("/api/approve", { method: "POST", body: JSON.stringify({ package: p, hours: 24, reason: "approved from dashboard" }) }).then(refresh);
  });
  $("approvals").addEventListener("click", function (e) {
    var p = e.target.getAttribute && e.target.getAttribute("data-rm"); if (!p) return;
    api("/api/approve?package=" + encodeURIComponent(p), { method: "DELETE" }).then(refresh);
  });
  function refresh() {
    api("/api/stats").then(function (s) {
      $("t-total").textContent = s.total; $("t-block").textContent = s.blocked; $("t-warn").textContent = s.warned; $("t-allow").textContent = s.allowed;
      $("rules").innerHTML = (s.top_rules || []).map(function (r) { return "<li><span>" + esc(r.name) + "</span><b>" + r.count + "</b></li>"; }).join("") || '<li class="meta">nothing flagged yet</li>';
    });
    api("/api/approvals").then(function (a) {
      $("approvals").innerHTML = (a || []).map(function (x) { return "<li><span>" + esc(x.name) + '<div class="meta">until ' + new Date(x.expires).toLocaleString() + '</div></span><button data-rm="' + esc(x.name) + '">revoke</button></li>'; }).join("") || '<li class="meta">none</li>';
    });
  }
  api("/api/events?limit=60").then(function (evs) { (evs || []).forEach(render); refresh(); }).catch(function () { try { sessionStorage.removeItem("pg_token"); } catch (e) {} location.reload(); });
  var es = new EventSource("/api/stream?token=" + encodeURIComponent(token));
  es.onopen = function () { $("dot").className = "dot on"; $("livetxt").textContent = "live"; };
  es.onerror = function () { $("dot").className = "dot"; $("livetxt").textContent = "reconnecting"; };
  es.onmessage = function (m) { try { render(JSON.parse(m.data)); refresh(); } catch (e) {} };
})();
</script>
</body>
</html>
